name: Build extension

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check extension and release versions
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const read = path => JSON.parse(readFileSync(path, 'utf8'));
          const version = read('package.json').version;
          if (read('public/manifest.json').version !== version) {
            throw new Error('package.json and public/manifest.json versions must match.');
          }
          if (process.env.RELEASE_TAG && process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Release tag must be v${version}. Update both version fields before tagging.`);
          }
          NODE
      - name: Build and test
        run: npm test
      - name: Validate Firefox extension
        run: npm run lint:extension
      - name: Package unsigned extension
        run: npm run package:zip
      - name: Upload extension ZIP
        uses: actions/upload-artifact@v7
        with:
          name: tabview-unsigned-${{ github.sha }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tabview-unsigned-${{ github.sha }}
          path: artifacts
      - name: Create draft release with unsigned ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/*.zip \
            --verify-tag --draft --title "Tabview $RELEASE_TAG" \
            --notes "Unsigned Firefox/Zen extension. For temporary installation, extract the ZIP and load manifest.json through about:debugging. Persistent installation requires Mozilla signing."
